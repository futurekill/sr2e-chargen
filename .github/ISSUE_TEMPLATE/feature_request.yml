name: "💡 Feature request"
description: Suggest an addition or improvement for the character generator or manager.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or gap, not the solution — "I want to X, but currently I have to Y."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: Rule reference (if this is a game rule)
      description: Book + page.
  - type: textarea
    id: notes
    attributes:
      label: Alternatives / mockups / extra notes
