# Accepted Trivy findings (docs/PLAN-release.md): each with an id, a reason and an expiry, like osv-scanner.toml.
vulnerabilities:
  - id: CVE-2026-107494
    statement: >-
      OpenSSL QUIC denial of service in the distroless base's libssl3t64 (no Debian fix yet, 2026-11-25). The app never
      uses QUIC: Fastify serves HTTP/1.1 behind the operator's TLS proxy, and Node's QUIC is experimental and off
      without --experimental-quic (not set). Look again when Debian ships a fix.
    expired_at: 2026-12-26
  - id: CVE-2026-124709
    statement: >-
      OpenSSL QUIC memory leak (denial of service) in the same libssl3t64, no fix yet (2026-11-25). Same reason: no QUIC
      in the app.
    expired_at: 2026-12-26
  - id: CVE-2026-124851
    statement: >-
      zstd information disclosure in the distroless base's libzstd1; Debian has the fix (1.5.7+dfsg-1+deb13u1) but the
      newest distroless image (2026-11-25) does not carry it yet. The app never loads libzstd1: Node uses its own
      bundled zstd. Short expiry: move to the rebuilt base image as soon as it ships.
    expired_at: 2026-12-09
